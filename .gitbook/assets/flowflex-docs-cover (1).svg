<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1990 480" width="1990" height="480" role="img" aria-label="FlowFlex Docs: automate customer conversations on WhatsApp" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- FlowFlex Docs cover for GitBook (1990 x 480). Key content sits in the centre 1100px so it survives GitBook's side cropping on smaller screens.
       Colours are placeholders (neutral + one accent) until the brand palette is confirmed:
       BG #F5F7FA  INK #111827  QUIET #4B5563  ACCENT #2563EB -->
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#CBD5E1" fill-opacity="0.55"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#F5F7FA" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#F5F7FA" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#F5F7FA" stop-opacity="1"/>
      <stop offset="1" stop-color="#F5F7FA" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1990" height="480" fill="#F5F7FA"/>
  <rect width="1990" height="480" fill="url(#dots)"/>
  <rect x="380" width="1230" height="480" fill="url(#fade)"/>

  <!-- Decorative edges (safe to crop) -->
  <g fill="none" stroke="#2563EB" stroke-opacity="0.18" stroke-width="3">
    <path d="M0 360 C120 360 160 250 280 250 S 360 140 420 140"/>
    <path d="M1990 120 C1870 120 1830 230 1710 230 S 1630 340 1570 340"/>
  </g>
  <g fill="#2563EB">
    <rect x="80" y="110" width="150" height="48" rx="24" fill-opacity="0.10"/>
    <rect x="150" y="176" width="110" height="48" rx="24" fill-opacity="0.16"/>
    <circle cx="280" cy="250" r="9" fill-opacity="0.35"/>
    <rect x="1740" y="280" width="160" height="48" rx="24" fill-opacity="0.10"/>
    <rect x="1700" y="346" width="120" height="48" rx="24" fill-opacity="0.16"/>
    <circle cx="1710" cy="230" r="9" fill-opacity="0.35"/>
  </g>

  <!-- Text block -->
  <g font-family="Gilroy, Arial, sans-serif">
    <text x="450" y="160" font-size="26" font-weight="700" fill="#2563EB" letter-spacing="4">FLOWFLEX DOCS</text>
    <text font-size="62" font-weight="700" fill="#111827">
      <tspan x="450" y="236">Automate customer</tspan>
      <tspan x="450" y="308">conversations</tspan>
    </text>
    <text x="450" y="370" font-size="30" fill="#4B5563">on WhatsApp</text>
  </g>

  <!-- Flow illustration -->
  <g transform="translate(45 0)">
  <g font-family="Gilroy, Arial, sans-serif" font-weight="700" font-size="28" fill="#111827">
    <!-- connectors -->
    <g stroke="#94A3B8" stroke-width="3" fill="none">
      <path d="M1335 164 V196"/>
      <path d="M1335 274 V296 M1335 296 H1240 V324 M1335 296 H1430 V324"/>
    </g>
    <!-- Node: trigger -->
    <g filter="url(#shadow)">
      <rect x="1175" y="90" width="320" height="74" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    </g>
    <circle cx="1217" cy="127" r="22" fill="#2563EB"/>
    <path d="M1205 118 h24 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-14 l-8 7 v-7 h-2 a4 4 0 0 1 -4 -4 v-10 a4 4 0 0 1 4 -4 z" fill="#FFFFFF"/>
    <text x="1255" y="137">New message</text>
    <!-- Node: menu -->
    <g filter="url(#shadow)">
      <rect x="1175" y="200" width="320" height="74" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    </g>
    <circle cx="1217" cy="237" r="22" fill="#2563EB" fill-opacity="0.14"/>
    <g stroke="#2563EB" stroke-width="3.5" stroke-linecap="round">
      <path d="M1207 228 h20 M1207 237 h20 M1207 246 h20"/>
    </g>
    <text x="1255" y="247">Send menu</text>
    <!-- Branches -->
    <g filter="url(#shadow)">
      <rect x="1160" y="326" width="160" height="64" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
      <rect x="1350" y="326" width="160" height="64" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    </g>
    <text x="1240" y="368" text-anchor="middle">Sales</text>
    <text x="1430" y="368" text-anchor="middle">Support</text>
  </g>
  </g>
</svg>
