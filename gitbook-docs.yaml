$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1
site:
  title: FlowFlex documentation
  structure:
    - type: space
      key: space-get-started
      title: Get started
      path: get-started
      default: true
      content:
        directory: ./get-started

    - type: space
      key: space-whatsapp
      title: WhatsApp setup
      path: whatsapp
      content:
        directory: ./whatsapp

    - type: space
      key: space-audience
      title: Audience
      path: audience
      content:
        directory: ./audience

    - type: space
      key: space-broadcasts
      title: Broadcasts
      path: broadcasts
      content:
        directory: ./broadcasts

    - type: space
      key: space-messaging
      title: Messaging
      path: messaging
      content:
        directory: ./messaging

    - type: space
      key: space-flows
      title: Workflows
      path: flows
      content:
        directory: ./flows

    - type: space
      key: space-integrations
      title: Integrations
      path: integrations
      content:
        directory: ./integrations

    - type: space
      key: space-developers
      title: Developer quick start
      path: developers
      content:
        directory: ./developers

    - type: space
      key: space-sdk
      title: SDK
      path: sdk
      content:
        directory: ./sdk

    - type: space
      key: space-api
      title: REST API
      path: api
      content:
        directory: ./api

    - type: space
      key: space-account
      title: Account
      path: account
      content:
        directory: ./account

    - type: space
      key: space-help
      title: Help
      path: help
      content:
        directory: ./help
